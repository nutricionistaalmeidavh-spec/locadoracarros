name: Locadora Windows Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify source
        run: npm run verify
      - name: Code coverage
        run: npm run coverage
      - name: Build Windows installer
        run: npm run dist
      - name: Validate installer
        shell: pwsh
        run: |
          $files = Get-ChildItem release/Sistema-Locadora-Setup-*.exe
          if ($files.Count -lt 1) { throw 'Installer artifact missing' }
          if ($files[0].Length -lt 1MB) { throw 'Installer artifact unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: Sistema-Locadora-Windows
          path: release/Sistema-Locadora-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
