name: Locadora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Check + Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  qa:
    name: ArtiSys QA Electron
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 20
    env:
      LOCADORA_QA_ADMIN_PASSWORD: "1234"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install ArtiSys QA
        run: npm run qa:install
      - name: Validate QA manifest
        run: node qa/artisys-qa/src/cli.mjs validate --config qa/artisys-qa/locadora.config.json
      - name: Run Electron QA
        run: xvfb-run -a npm run qa:full
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locadora-qa-${{ github.run_id }}
          path: |
            qa-artifacts/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
